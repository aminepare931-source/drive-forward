<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Steering wheel -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="white" stroke-width="4"/>
  <circle cx="32" cy="32" r="6" fill="white"/>
  <!-- Wheel spokes -->
  <line x1="32" y1="12" x2="32" y2="26" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="26" y2="32" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="38" y2="32" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <!-- Road line at bottom -->
  <line x1="20" y1="50" x2="44" y2="50" stroke="white" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4"/>
</svg>